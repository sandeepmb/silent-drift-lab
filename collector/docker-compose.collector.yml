# collector/docker-compose.collector.yml
#
#   make otel-up      → docker compose -f collector/docker-compose.collector.yml up -d
#   make otel-down
#
# One container: the OpenTelemetry Collector (contrib distribution, pinned).
# It listens on the host's 4317 (gRPC) and 4318 (HTTP) and forwards traces to
# the self-hosted Opik on the host (host.docker.internal:5173).
#
# Pin policy: bump the tag deliberately; the contrib image moves fast and the
# `debug`/`otlphttp` exporter config keys used in otel-collector.yaml are
# stable from 0.100 onwards.

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    container_name: silent-drift-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "13133:13133" # health_check extension → curl http://localhost:13133
    environment:
      # Forwarded into otel-collector.yaml via ${env:...} for the optional
      # cloud / fan-out exporters. Harmless when unset.
      OPIK_API_KEY: ${OPIK_API_KEY:-}
      SECOND_BACKEND_API_KEY: ${SECOND_BACKEND_API_KEY:-}
    extra_hosts:
      # Docker Desktop (macOS/Windows) resolves host.docker.internal natively;
      # this line makes it work on Linux too.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
